<script>
  window.esc = function(s) {
    return String(s ?? '').replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  };

  // ==========================================================================
  // CORREÇÃO DEFINITIVA DO BUG DE DATA PRESA EM 18 DE JANEIRO DE 2026 (FUSO UTC-3)
  // No Brasil (GMT-3), new Date("2026-01-18") virava 17/01 às 21h, e ao somar +1 dia
  // voltava para 18/01! Forçando T12:00:00, os botões "+1 DIA", "ATÉ O JOGO" e
  // "JOGAR PARTIDA" do próprio jogo avançam e iniciam a partida imediatamente!
  // ==========================================================================
  (function() {
    const NativeDate = window.Date;
    function SafeBrazilDate(...args) {
      if (args.length === 1 && typeof args[0] === 'string') {
        const s = args[0].trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
          args[0] = s + 'T12:00:00';
        }
      }
      if (!new.target) return NativeDate(...args);
      return new NativeDate(...args);
    }
    Object.setPrototypeOf(SafeBrazilDate, NativeDate);
    SafeBrazilDate.prototype = NativeDate.prototype;
    SafeBrazilDate.now = NativeDate.now;
    SafeBrazilDate.UTC = NativeDate.UTC;
    SafeBrazilDate.parse = function(str) {
      if (typeof str === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(str.trim())) {
        return NativeDate.parse(str.trim() + 'T12:00:00');
      }
      return NativeDate.parse(str);
    };
    window.Date = SafeBrazilDate;
  })();

  // Bloqueia apenas MutationObservers infinitos de módulos externos
  window.MutationObserver = function() {
    return {
      observe: function() {},
      disconnect: function() {},
      takeRecords: function() { return []; }
    };
  };
</script>

<script>

    window.setInterval = function(fn, delay) {
      var safeDelay = (typeof delay === 'number' && delay < 2500) ? 3500 : delay;
      return origSetInterval(function() {
        try {
          if (typeof window.AFM_EnsureSafeState === 'function') window.AFM_EnsureSafeState();
          fn();
        } catch (e) {}
      }, safeDelay);
    };
  })();
</script>

<!-- 5. Salvaguarda de Descongelamento Imediato da Splash Screen -->
<script id="afmAutoDismissSplash">
  (function() {
    function dismissSplash() {
      var loader = document.getElementById('afmLoadingScreen');
      var app = document.getElementById('app');
      if (typeof window.render === 'function') {
        try { window.render(); } catch(e) {}
      }
      // Garante que o loader só suma se o app tiver conteúdo ou após timeout absoluto
      if (loader) {
        var hasContent = app && app.children.length > 0 && (app.children[0] !== loader || app.children.length > 1 || (app.innerText && app.innerText.trim().length > 0));
        if (hasContent) {
          loader.style.transition = 'opacity 0.25s ease';
          loader.style.opacity = '0';
          setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 250);
        }
      }
    }
    if (document.readyState === 'complete') {
      setTimeout(dismissSplash, 150);
    } else {
      window.addEventListener('load', function() { setTimeout(dismissSplash, 150); });
      var timer = setInterval(function() {
        dismissSplash();
        if (!document.getElementById('afmLoadingScreen')) clearInterval(timer);
      }, 250);
      setTimeout(function() {
        clearInterval(timer);
        var loader = document.getElementById('afmLoadingScreen');
        if (loader) {
          loader.style.transition = 'opacity 0.25s ease';
          loader.style.opacity = '0';
          setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 250);
        }
      }, 3000);
    }
  })();
</script>
