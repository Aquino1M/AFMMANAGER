<script>
  window.esc = function(s) {
    return String(s ?? '').replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  };

  window.AFM_SafeImg = function(img) {
    if (!img || img.dataset.fallbackApplied) return;
    img.dataset.fallbackApplied = '1';
    var label = (img.alt || 'AFM').replace(/[^A-Za-z0-9]/g, '').slice(0, 3).toUpperCase() || 'FC';
    img.src = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" rx="18" fill="#1e293b"/>' +
      '<text x="50" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#94a3b8" text-anchor="middle">' + label + '</text></svg>'
    );
  };

  // ============================================================================
  // ESCUDO ANTI-TRAVAMENTO GLOBAL (Impede Loop Infinito ao clicar nas abas)
  // ============================================================================
  (function() {
    const NativeMutationObserver = window.MutationObserver;
    let isInternalMutationRunning = false;

    // 1. Domestica todos os MutationObservers dos módulos para NUNCA entrarem em loop infinito
    if (NativeMutationObserver) {
      window.MutationObserver = function(callback) {
        let timer = null;
        let savedTarget = null;
        let savedOptions = null;
        let nativeInstance = null;

        nativeInstance = new NativeMutationObserver(function(mutations, obs) {
          if (isInternalMutationRunning) return;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function() {
            if (isInternalMutationRunning) return;
            isInternalMutationRunning = true;
            try {
              if (nativeInstance) nativeInstance.disconnect();
              if (typeof window.AFM_NormalizeStateArrays === 'function') window.AFM_NormalizeStateArrays();
              callback(mutations, obs);
            } catch (err) {
              console.warn('[AFM Observer Guard]', err);
            } finally {
              setTimeout(function() {
                isInternalMutationRunning = false;
                if (savedTarget && nativeInstance) {
                  try { nativeInstance.observe(savedTarget, savedOptions); } catch (e) {}
                }
              }, 120);
            }
          }, 180);
        });

        return {
          observe: function(target, options) {
            savedTarget = target || document.body;
            // Evita observar attributes/characterData em árvore inteira que gera recursão infinita
            savedOptions = {
              childList: true,
              subtree: options ? !!options.subtree : true,
              attributes: false,
              characterData: false
            };
            try { nativeInstance.observe(savedTarget, savedOptions); } catch (e) {}
          },
          disconnect: function() {
            if (timer) clearTimeout(timer);
            try { nativeInstance.disconnect(); } catch (e) {}
          },
          takeRecords: function() {
            return nativeInstance ? nativeInstance.takeRecords() : [];
          }
        };
      };
      window.MutationObserver.prototype = NativeMutationObserver.prototype;
    }

    // 2. Domestica setIntervals muito rápidos (< 1000ms) de scripts de UI para não congelar cliques
    const nativeSetInterval = window.setInterval;
    window.setInterval = function(fn, delay) {
      var safeDelay = (typeof delay === 'number' && delay >= 350 && delay < 1200) ? 1600 : delay;
      var args = Array.prototype.slice.call(arguments, 2);
      return nativeSetInterval(function() {
        if (isInternalMutationRunning) return;
        try {
          if (typeof window.AFM_NormalizeStateArrays === 'function') window.AFM_NormalizeStateArrays();
          if (typeof fn === 'function') fn.apply(window, args);
        } catch (err) {
          console.warn('[AFM Interval Guard]', err);
        }
      }, safeDelay);
    };

    // 3. Garante que todo clique em Aba ou Botão normalize os dados antes e limpe textos quebrados depois
    document.addEventListener('click', function() {
      try {
        if (typeof window.AFM_NormalizeStateArrays === 'function') window.AFM_NormalizeStateArrays();
        setTimeout(function() {
          if (typeof window.AFM_CleanBrokenTextOnce === 'function') window.AFM_CleanBrokenTextOnce();
        }, 80);
      } catch (e) {}
    }, true);
  })();

  window.__afmBootErrors = [];
  window.addEventListener('error', function(e) {
    var msg = (e.message || 'Erro desconhecido') + ' (' + (e.filename ? e.filename.split('/').pop() : 'script') + ':' + (e.lineno || '?') + ')';
    window.__afmBootErrors.push(msg);
    var errBox = document.getElementById('afmBootErrorBox');
    var timeoutBox = document.getElementById('afmLoadingTimeout');
    if (errBox) {
      errBox.style.display = 'block';
      errBox.innerHTML = '<b>⚠️ Erro detectado no boot:</b><br>' + window.__afmBootErrors.join('<br>');
    }
    if (timeoutBox) timeoutBox.style.display = 'block';
  });
</script>

    <div style="margin-bottom:24px;text-align:center;">
      <div style="width:84px;height:84px;margin:0 auto 16px auto;background:linear-gradient(135deg, #7c3aed, #2563eb);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(124,58,237,0.6);border:2px solid rgba(255,255,255,0.2);">
        <span style="font-size:42px;">⚽</span>
      </div>
      <h1 style="margin:0;font-size:26px;font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,#a855f7,#38bdf8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">AFM MANAGER 2027</h1>
      <p style="margin:6px 0 0 0;font-size:12px;color:#94a3b8;letter-spacing:3px;font-weight:700;text-transform:uppercase;">Aquino Futebol Manager</p>
    </div>

    <!-- Barra de Progresso Neon -->
    <div style="width:280px;height:8px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.12);box-shadow:0 0 15px rgba(124,58,237,0.3);">
      <div id="afmLoadingBar" style="width:45%;height:100%;background:linear-gradient(90deg, #7c3aed, #38bdf8, #22c55e);border-radius:999px;animation:afmPulse 1.8s infinite ease-in-out;"></div>
    </div>

    <!-- Status do Carregamento -->
    <div id="afmLoadingText" style="margin-top:14px;font-size:12px;color:#cbd5e1;font-weight:600;letter-spacing:0.5px;">
      Carregando banco de dados & táticas...
    </div>

    <!-- Caixa de Diagnóstico de Erro de Script -->
    <div id="afmBootErrorBox" style="display:none;margin-top:16px;max-width:520px;background:rgba(127,29,29,0.92);border:1px solid #ef4444;color:#fecaca;padding:10px 14px;border-radius:10px;font-family:monospace;font-size:11px;line-height:1.5;text-align:left;"></div>

    <!-- Opção de Recarregar / Destravar -->
    <div id="afmLoadingTimeout" style="display:none;margin-top:20px;text-align:center;">
      <p style="font-size:11px;color:#f87171;margin-bottom:10px;">O carregamento travou ou encontrou um conflito de cache/save.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button onclick="location.reload();" style="background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;">
          🔄 Recarregar Jogo
        </button>
        <button onclick="if(window.render){document.getElementById('afmLoadingScreen')?.remove();window.render();}else if(window.init){window.init();}" style="background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;">
          ⚡ Forçar Abertura da Tela
        </button>
        <button onclick="if(confirm('Isso limpará apenas o cache de inicialização travado e recarregará. Continuar?')){localStorage.removeItem('afm_save_v1');localStorage.removeItem('afm_state');location.reload();}" style="background:#dc2626;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px;">
          🛠️ Limpar Save Corrompido
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Desregistra Service Workers antigos que prendem arquivos em cache
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    }).catch(function() {});
  }

  setTimeout(() => {
    const loading = document.getElementById('afmLoadingScreen');
    const timeoutEl = document.getElementById('afmLoadingTimeout');
    if (loading) {
      const app = document.getElementById('app');
      if (app && app.children.length > 1) {
        loading.remove();
        return;
      }
      if (typeof window.render === 'function') {
        try { window.render(); } catch (e) { console.error(e); }
      }
      if (document.getElementById('afmLoadingScreen') && timeoutEl) {
        timeoutEl.style.display = 'block';
      }
    }
  }, 3500);
</script>
