<script>
  window.addEventListener('load', () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const isAdm = params.get('user') === 'admin';
      const isCustom = params.get('custom') === '1';
      localStorage.setItem('afm_accounts_v1', JSON.stringify([
        { username: 'aquino', name: 'Prof. Aquino', password: '123', role: 'player' },
        { username: 'admin', name: 'Administrador', password: '123', role: 'admin' }
      ]));
      localStorage.setItem('afm_active_user_v1', isAdm ? 'admin' : 'aquino');
      if (!window.state) {
        if (isCustom) {
          try {
            newCareer({
              isCustomClub: true,
              compId: 'bra-est-sp',
              stateCompId: 'bra-est-sp',
              clubName: 'Valência Futebol Clube',
              shortName: 'VFC',
              stadiumName: 'Arena dos Sonhos',
              badgeConfig: {
                shape: 'classic',
                primaryColor: '#1e3a8a',
                secondaryColor: '#facc15',
                pattern: 'star',
                patternColor: '#ffffff',
                motto: 'VFC',
                mottoColor: '#ffffff',
                borderStyle: 'classic'
              },
              homeKit: { shirtColor: '#1e3a8a', secondaryColor: '#ffffff' },
              awayKit: { shirtColor: '#ffffff', secondaryColor: '#1e3a8a' },
              manager: isAdm ? 'Administrador' : 'Prof. Aquino',
              slot: 1
            });
          } catch(e) {
            document.body.innerHTML = '<div style="color:red;padding:40px;font-size:20px">' + (e.stack || e.message) + '</div>';
            return;
          }
        } else {
          newCareer({ clubName: 'Corinthians', compId: 'bra-a', managerName: isAdm ? 'Administrador' : 'Prof. Aquino' });
        }
      }
      if (params.get('balance')) {
        window.state.balance = Number(params.get('balance'));
      }
      const targetView = params.get('view') || 'meutime';
      window.view = targetView;
      if (params.get('configTab')) {
        window.configTab = params.get('configTab');
      }
      render();
    } catch(err) {
      console.error('Harness init error:', err);
      document.body.innerHTML += '<div style="color:red;padding:20px;font-size:18px">' + err.stack + '</div>';
    }
  });
</script>
