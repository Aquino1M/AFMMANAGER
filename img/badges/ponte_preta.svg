<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="ponteClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#ponteClip)">
    <!-- White Shield Body -->
    <rect x="40" y="50" width="320" height="420" fill="#ffffff"/>
    <!-- Distinctive Black Diagonal Sash -->
    <polygon points="30,60 120,40 370,360 280,380" fill="#111111"/>
    <!-- Inner white accent lines along sash -->
    <line x1="120" y1="40" x2="370" y2="360" stroke="#ffffff" stroke-width="2"/>
    <line x1="30" y1="60" x2="280" y2="380" stroke="#ffffff" stroke-width="2"/>
    <!-- Letters A.A.P.P. in White on Black Sash -->
    <text x="200" y="222" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(52, 200, 210)" letter-spacing="4">A.A.P.P.</text>
    <!-- 1900 in Black at the bottom left -->
    <rect x="75" y="300" width="90" height="30" rx="15" fill="#111111"/>
    <text x="120" y="321" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">1900</text>
    <!-- CAMPINAS text at top right -->
    <text x="270" y="115" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="1">CAMPINAS</text>
  </g>
</svg>
