<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 3 Stars on top (Copa do Brasil 1991, Série B 2002, Série C 2006) -->
  <polygon points="200,10 205,25 220,25 208,35 212,50 200,40 188,50 192,35 180,25 195,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="150,18 153,30 165,30 155,38 159,50 150,42 141,50 145,38 135,30 147,30" fill="#d5d8dc" stroke="#95a5a6" stroke-width="1"/>
  <polygon points="250,18 253,30 265,30 255,38 259,50 250,42 241,50 245,38 235,30 247,30" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <clipPath id="criciumaClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#criciumaClip)">
    <!-- Top Half: Vibrant Yellow -->
    <rect x="40" y="65" width="320" height="175" fill="#f5b800"/>
    <!-- Middle White Horizontal Band -->
    <rect x="40" y="240" width="320" height="30" fill="#ffffff"/>
    <!-- Bottom Half: Black -->
    <rect x="40" y="270" width="320" height="200" fill="#111111"/>
    <!-- Center Emblem Circle -->
    <circle cx="200" cy="245" r="95" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <circle cx="200" cy="245" r="85" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
    <!-- C.E.C. in Black bold with yellow center -->
    <text x="200" y="258" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="1">C.E.C.</text>
    <!-- 1947 text below -->
    <rect x="155" y="280" width="90" height="24" rx="6" fill="#111111"/>
    <text x="200" y="297" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#f5b800" text-anchor="middle">1947</text>
    <!-- CRICIÚMA text at top of badge -->
    <text x="200" y="115" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="3">CRICIÚMA</text>
  </g>
</svg>
