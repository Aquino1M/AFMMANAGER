<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 2 Stars on top (Bicampeão Paulista: 2002 e 2014) -->
  <polygon points="170,12 174,25 188,25 177,34 181,47 170,39 159,47 163,34 152,25 166,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="230,12 234,25 248,25 237,34 241,47 230,39 219,47 223,34 212,25 226,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="ituClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#ituClip)">
    <!-- White background -->
    <rect x="40" y="65" width="320" height="410" fill="#ffffff"/>
    <!-- Red and Black vertical stripes -->
    <rect x="40" y="160" width="45" height="310" fill="#cc1111"/>
    <rect x="85" y="160" width="45" height="310" fill="#111111"/>
    <rect x="130" y="160" width="45" height="310" fill="#cc1111"/>
    <rect x="175" y="160" width="50" height="310" fill="#111111"/>
    <rect x="225" y="160" width="45" height="310" fill="#cc1111"/>
    <rect x="270" y="160" width="45" height="310" fill="#111111"/>
    <rect x="315" y="160" width="45" height="310" fill="#cc1111"/>
    <!-- Upper Header Box in Black -->
    <rect x="40" y="65" width="320" height="95" fill="#111111"/>
    <line x1="40" y1="160" x2="360" y2="160" stroke="#cc1111" stroke-width="4"/>
    <text x="200" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ITUANO F.C.</text>
    <!-- Center Galo Emblem Circle -->
    <circle cx="200" cy="275" r="75" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <circle cx="200" cy="275" r="66" fill="#cc1111"/>
    <text x="200" y="272" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">ITUANO</text>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f1c40f" text-anchor="middle">1947</text>
  </g>
</svg>
