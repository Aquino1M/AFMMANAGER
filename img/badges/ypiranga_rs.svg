<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#007a3d" stroke-width="8"/>
  <clipPath id="ypiClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#ypiClip)">
    <!-- Green background -->
    <rect x="40" y="50" width="320" height="420" fill="#007a3d"/>
    <!-- Yellow vertical stripes -->
    <rect x="80" y="150" width="40" height="320" fill="#f5b800"/>
    <rect x="160" y="150" width="40" height="320" fill="#f5b800"/>
    <rect x="240" y="150" width="40" height="320" fill="#f5b800"/>
    <rect x="320" y="150" width="40" height="320" fill="#f5b800"/>
    <!-- Upper Header Box in Yellow -->
    <rect x="40" y="50" width="320" height="100" fill="#f5b800"/>
    <line x1="40" y1="150" x2="360" y2="150" stroke="#007a3d" stroke-width="4"/>
    <text x="200" y="115" font-family="'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" fill="#007a3d" text-anchor="middle" letter-spacing="4">Y.F.C.</text>
    <!-- Center Canarinho Circle -->
    <circle cx="200" cy="270" r="85" fill="#ffffff" stroke="#007a3d" stroke-width="6"/>
    <text x="200" y="265" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#007a3d" text-anchor="middle">YPIRANGA</text>
    <rect x="155" y="285" width="90" height="24" rx="12" fill="#007a3d"/>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#f5b800" text-anchor="middle">1924</text>
  </g>
</svg>
