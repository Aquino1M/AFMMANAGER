<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 3 Stars on top (Tricampeão Brasileiro Série C: 1996, 2015, 2020) -->
  <polygon points="200,8 205,23 220,23 208,33 212,48 200,38 188,48 192,33 180,23 195,23" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="150,16 153,28 165,28 155,36 159,48 150,40 141,48 145,36 135,28 147,28" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="250,16 253,28 265,28 255,36 259,48 250,40 241,48 245,36 235,28 247,28" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#d31027" stroke-width="8"/>
  <clipPath id="vilaClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#vilaClip)">
    <!-- Red Background -->
    <rect x="40" y="65" width="320" height="420" fill="#d31027"/>
    <!-- Center Emblem Circle -->
    <circle cx="200" cy="245" r="115" fill="#ffffff" stroke="#d31027" stroke-width="8"/>
    <circle cx="200" cy="245" r="102" fill="#d31027"/>
    <!-- Outer Ring Text Path: VILA NOVA F.C. -->
    <path id="vilaCircleTop" d="M 105,245 A 95,95 0 0,1 295,245" fill="none"/>
    <text font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">
      <textPath href="#vilaCircleTop" startOffset="50%" text-anchor="middle">
        VILA NOVA F.C.
      </textPath>
    </text>
    <path id="vilaCircleBottom" d="M 295,245 A 95,95 0 0,1 105,245" fill="none"/>
    <text font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f1c40f" letter-spacing="5">
      <textPath href="#vilaCircleBottom" startOffset="50%" text-anchor="middle">
        GOIÂNIA • 1943
      </textPath>
    </text>
    <!-- Inner White Soccer Ball / Vigor Center -->
    <circle cx="200" cy="245" r="50" fill="#ffffff" stroke="#d31027" stroke-width="4"/>
    <polygon points="200,225 215,235 210,252 190,252 185,235" fill="#d31027"/>
    <polygon points="175,260 185,252 195,260 190,272 180,270" fill="#d31027"/>
    <polygon points="225,260 215,252 205,260 210,272 220,270" fill="#d31027"/>
    <!-- TIGRÃO text at bottom -->
    <rect x="145" y="380" width="110" height="28" rx="14" fill="#ffffff"/>
    <text x="200" y="399" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#d31027" text-anchor="middle">TIGRÃO</text>
  </g>
</svg>
