<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cwcGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldCwc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="190" height="190" x="5" y="5" rx="30" fill="url(#cwcGrad)" stroke="url(#goldCwc)" stroke-width="4"/>
  <!-- World Cup Trophy Silhouette & Globe -->
  <g transform="translate(100, 85) scale(0.9) translate(-100, -85)">
    <!-- Globe in Center -->
    <circle cx="100" cy="55" r="22" fill="none" stroke="url(#goldCwc)" stroke-width="3"/>
    <ellipse cx="100" cy="55" rx="10" ry="22" fill="none" stroke="url(#goldCwc)" stroke-width="2"/>
    <line x1="78" y1="55" x2="122" y2="55" stroke="url(#goldCwc)" stroke-width="2"/>
    <!-- Supporting Pillars -->
    <path d="M 82 77 L 88 125 L 112 125 L 118 77 Z" fill="url(#goldCwc)"/>
    <circle cx="100" cy="100" r="8" fill="#ffffff"/>
    <!-- Base -->
    <path d="M 75 125 L 125 125 L 128 140 L 72 140 Z" fill="url(#goldCwc)"/>
  </g>
  <text x="100" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" letter-spacing="3">FIFA</text>
  <text x="100" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" letter-spacing="2">MUNDIAL DE</text>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="url(#goldCwc)" letter-spacing="3">CLUBES</text>
</svg>
