<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 2 Golden Stars on top (Série C 2018 & Série D 2017) -->
  <polygon points="170,12 174,25 188,25 177,34 181,47 170,39 159,47 163,34 152,25 166,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="230,12 234,25 248,25 237,34 241,47 230,39 219,47 223,34 212,25 226,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Circular Shield with borders -->
  <circle cx="200" cy="255" r="190" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <circle cx="200" cy="255" r="176" fill="#111111"/>
  <!-- Text Ring -->
  <path id="textCircleTop" d="M 45,255 A 155,155 0 0,1 355,255" fill="none"/>
  <text font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      OPERÁRIO FERROVIÁRIO E.C.
    </textPath>
  </text>
  <path id="textCircleBottom" d="M 355,255 A 155,155 0 0,1 45,255" fill="none"/>
  <text font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#f1c40f" letter-spacing="4">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      PONTA GROSSA • 1912
    </textPath>
  </text>
  <!-- Inner Shield Area with black and white stripes -->
  <clipPath id="ofecInner">
    <circle cx="200" cy="255" r="126"/>
  </clipPath>
  <g clip-path="url(#ofecInner)">
    <rect x="70" y="125" width="260" height="260" fill="#ffffff"/>
    <rect x="70" y="125" width="37" height="260" fill="#111111"/>
    <rect x="144" y="125" width="37" height="260" fill="#111111"/>
    <rect x="218" y="125" width="37" height="260" fill="#111111"/>
    <rect x="292" y="125" width="37" height="260" fill="#111111"/>
    <!-- Center white diamond/badge for OFEC monogram -->
    <polygon points="200,165 285,255 200,345 115,255" fill="#111111" stroke="#ffffff" stroke-width="6"/>
    <text x="200" y="270" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">OFEC</text>
  </g>
  <circle cx="200" cy="255" r="126" fill="none" stroke="#ffffff" stroke-width="6"/>
</svg>
