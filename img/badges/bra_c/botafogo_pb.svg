<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="bpbClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#bpbClip)">
    <!-- White background -->
    <rect x="40" y="50" width="320" height="420" fill="#ffffff"/>
    <!-- Black vertical stripes -->
    <rect x="40" y="150" width="45" height="320" fill="#111111"/>
    <rect x="125" y="150" width="45" height="320" fill="#111111"/>
    <rect x="230" y="150" width="45" height="320" fill="#111111"/>
    <rect x="315" y="150" width="45" height="320" fill="#111111"/>
    <!-- Upper Header Box in Black -->
    <rect x="40" y="50" width="320" height="100" fill="#111111"/>
    <line x1="40" y1="150" x2="360" y2="150" stroke="#cc1111" stroke-width="5"/>
    <text x="200" y="115" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">BOTAFOGO-PB</text>
    <!-- Center Emblem Circle with RED STAR (Estrela Vermelha da Paraíba) -->
    <circle cx="200" cy="270" r="85" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <circle cx="200" cy="270" r="75" fill="#111111"/>
    <!-- Red Five-Pointed Star -->
    <polygon points="200,205 214,248 260,248 223,275 237,318 200,292 163,318 177,275 140,248 186,248" fill="#cc1111" stroke="#ffffff" stroke-width="3"/>
    <!-- 1931 below -->
    <rect x="155" y="380" width="90" height="26" rx="13" fill="#111111"/>
    <text x="200" y="398" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1931</text>
  </g>
</svg>
