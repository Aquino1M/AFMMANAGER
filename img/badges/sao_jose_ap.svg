<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <filter id="sjApShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Shield Border -->
  <path d="M 150 10 C 230 10, 275 22, 275 45 C 275 175, 220 280, 150 310 C 80 280, 25 175, 25 45 C 25 22, 70 10, 150 10 Z" fill="#ffffff" stroke="#c8102e" stroke-width="8" filter="url(#sjApShadow)"/>
  <clipPath id="sjApClip">
    <path d="M 150 16 C 224 16, 267 28, 267 49 C 267 172, 214 272, 150 302 C 86 272, 33 172, 33 49 C 33 28, 76 16, 150 16 Z"/>
  </clipPath>
  <g clip-path="url(#sjApClip)">
    <!-- Red Background Top -->
    <path d="M 20 10 L 280 10 L 280 70 L 20 70 Z" fill="#c8102e"/>
    <text x="150" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="21" fill="#ffffff" letter-spacing="3">SÃO JOSÉ - AP</text>
    <path d="M 20 70 L 280 70 L 280 76 L 20 76 Z" fill="#ffffff"/>
    <!-- Red & White Vertical Stripes -->
    <path d="M 30 76 L 70 76 L 70 310 L 30 310 Z" fill="#c8102e"/>
    <path d="M 70 76 L 110 76 L 110 310 L 70 310 Z" fill="#ffffff"/>
    <path d="M 110 76 L 150 76 L 150 310 L 110 310 Z" fill="#c8102e"/>
    <path d="M 150 76 L 190 76 L 190 310 L 150 310 Z" fill="#ffffff"/>
    <path d="M 190 76 L 230 76 L 230 310 L 190 310 Z" fill="#c8102e"/>
    <path d="M 230 76 L 270 76 L 270 310 L 230 310 Z" fill="#ffffff"/>
    <!-- Center Monogram Circle SJEC -->
    <circle cx="150" cy="180" r="58" fill="#ffffff" stroke="#c8102e" stroke-width="5"/>
    <circle cx="150" cy="180" r="48" fill="#c8102e"/>
    <text x="150" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">SJEC</text>
    <!-- Amapá Star -->
    <polygon points="150,140 152,146 158,146 153,150 155,156 150,152 145,156 147,150 142,146 148,146" fill="#facc15"/>
    <!-- Bottom banner MACAPÁ 1946 -->
    <path d="M 90 262 L 210 262 L 200 286 L 100 286 Z" fill="#c8102e" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="2">MACAPÁ 1946</text>
  </g>
</svg>
