<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 2 Golden Stars on top (Copa do Brasil 1999 & Série B 1994) -->
  <polygon points="170,12 174,25 188,25 177,34 181,47 170,39 159,47 163,34 152,25 166,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="230,12 234,25 248,25 237,34 241,47 230,39 219,47 223,34 212,25 226,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#007a3d" stroke-width="6"/>
  <clipPath id="juvClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#juvClip)">
    <!-- White background -->
    <rect x="40" y="65" width="320" height="410" fill="#ffffff"/>
    <!-- Green vertical stripes -->
    <rect x="40" y="65" width="45" height="410" fill="#007a3d"/>
    <rect x="125" y="65" width="45" height="410" fill="#007a3d"/>
    <rect x="230" y="65" width="45" height="410" fill="#007a3d"/>
    <rect x="315" y="65" width="45" height="410" fill="#007a3d"/>
    <!-- Center Soccer Ball and Green Circle -->
    <circle cx="200" cy="245" r="92" fill="#ffffff" stroke="#007a3d" stroke-width="8"/>
    <!-- Soccer ball patches -->
    <circle cx="200" cy="245" r="82" fill="#ffffff"/>
    <polygon points="200,205 220,220 212,242 188,242 180,220" fill="#007a3d"/>
    <polygon points="155,255 170,240 185,255 178,275 160,272" fill="#007a3d"/>
    <polygon points="245,255 230,240 215,255 222,275 240,272" fill="#007a3d"/>
    <!-- Diagonal Banner with "E.C. JUVENTUDE" -->
    <polygon points="40,285 360,185 360,245 40,345" fill="#ffffff" stroke="#007a3d" stroke-width="4"/>
    <polygon points="45,290 355,190 355,240 45,340" fill="#007a3d"/>
    <text x="200" y="275" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-17, 200, 265)" letter-spacing="2">E.C. JUVENTUDE</text>
    <!-- Foundation year -->
    <rect x="155" y="380" width="90" height="28" rx="14" fill="#007a3d"/>
    <text x="200" y="399" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1913</text>
  </g>
</svg>
