<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="brusqueClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#brusqueClip)">
    <!-- Yellow Background -->
    <rect x="40" y="50" width="320" height="420" fill="#f5b800"/>
    <!-- Red vertical stripe / halves -->
    <rect x="200" y="50" width="160" height="420" fill="#cc1111"/>
    <!-- Upper Header Box -->
    <rect x="40" y="50" width="320" height="95" fill="#111111"/>
    <line x1="40" y1="145" x2="360" y2="145" stroke="#ffffff" stroke-width="4"/>
    <text x="200" y="112" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">B.F.C.</text>
    <!-- Center Emblem Circle -->
    <circle cx="200" cy="260" r="85" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <text x="200" y="255" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#111111" text-anchor="middle">BRUSQUE</text>
    <rect x="155" y="275" width="90" height="24" rx="12" fill="#cc1111"/>
    <text x="200" y="292" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1987</text>
  </g>
</svg>
