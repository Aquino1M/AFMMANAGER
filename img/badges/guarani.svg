<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 1 Golden Star on top (Campeão Brasileiro 1978) -->
  <polygon points="200,10 205,25 220,25 208,35 212,50 200,40 188,50 192,35 180,25 195,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Circular Shield with borders -->
  <circle cx="200" cy="255" r="190" fill="#ffffff" stroke="#006837" stroke-width="8"/>
  <circle cx="200" cy="255" r="176" fill="#006837"/>
  <!-- Circular text path: GUARANI FUTEBOL CLUBE -->
  <path id="guaraniTop" d="M 50,255 A 150,150 0 0,1 350,255" fill="none"/>
  <text font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="3">
    <textPath href="#guaraniTop" startOffset="50%" text-anchor="middle">
      GUARANI F.C.
    </textPath>
  </text>
  <path id="guaraniBottom" d="M 350,255 A 150,150 0 0,1 50,255" fill="none"/>
  <text font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f1c40f" letter-spacing="4">
    <textPath href="#guaraniBottom" startOffset="50%" text-anchor="middle">
      CAMPINAS • 1911
    </textPath>
  </text>
  <!-- Inner Circle with Interlocking GFC Monogram -->
  <circle cx="200" cy="255" r="110" fill="#006837" stroke="#ffffff" stroke-width="6"/>
  <text x="200" y="278" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">GFC</text>
</svg>
