<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 2 Golden Stars on top (Copa dos Campeões 2002 e Série B) -->
  <polygon points="170,12 174,25 188,25 177,34 181,47 170,39 159,47 163,34 152,25 166,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="230,12 234,25 248,25 237,34 241,47 230,39 219,47 223,34 212,25 226,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#0099e6" stroke-width="8"/>
  <clipPath id="payClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#payClip)">
    <!-- White background -->
    <rect x="40" y="65" width="320" height="410" fill="#ffffff"/>
    <!-- Sky blue vertical stripes -->
    <rect x="75" y="160" width="35" height="310" fill="#0099e6"/>
    <rect x="145" y="160" width="35" height="310" fill="#0099e6"/>
    <rect x="220" y="160" width="35" height="310" fill="#0099e6"/>
    <rect x="290" y="160" width="35" height="310" fill="#0099e6"/>
    <!-- Upper Header Box in Sky Blue -->
    <rect x="40" y="65" width="320" height="100" fill="#0099e6"/>
    <line x1="40" y1="165" x2="360" y2="165" stroke="#ffffff" stroke-width="6"/>
    <text x="200" y="135" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">PSC</text>
    <!-- Center Wolf / Papão Emblem Badge -->
    <circle cx="200" cy="275" r="75" fill="#ffffff" stroke="#0099e6" stroke-width="6"/>
    <circle cx="200" cy="275" r="65" fill="#0099e6"/>
    <text x="200" y="272" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">PAYSANDU</text>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f1c40f" text-anchor="middle">1914</text>
  </g>
</svg>
