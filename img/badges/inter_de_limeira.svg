<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 1 Golden Star on top (Campeão Paulista de 1986) -->
  <polygon points="200,10 205,25 220,25 208,35 212,50 200,40 188,50 192,35 180,25 195,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="limeiraClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#limeiraClip)">
    <!-- White background -->
    <rect x="40" y="65" width="320" height="410" fill="#ffffff"/>
    <!-- Black vertical stripes -->
    <rect x="75" y="150" width="35" height="320" fill="#111111"/>
    <rect x="145" y="150" width="35" height="320" fill="#111111"/>
    <rect x="220" y="150" width="35" height="320" fill="#111111"/>
    <rect x="290" y="150" width="35" height="320" fill="#111111"/>
    <!-- Upper Header Box -->
    <rect x="40" y="65" width="320" height="95" fill="#111111"/>
    <line x1="40" y1="160" x2="360" y2="160" stroke="#111111" stroke-width="4"/>
    <text x="200" y="112" font-family="'Arial Black', Impact, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">INTER</text>
    <text x="200" y="142" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#f1c40f" text-anchor="middle" letter-spacing="3">A.A.I.L. • LIMEIRA</text>
    <!-- Center Emblem Circle -->
    <circle cx="200" cy="270" r="75" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <text x="200" y="270" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#111111" text-anchor="middle">AAIL</text>
    <rect x="155" y="285" width="90" height="24" rx="12" fill="#111111"/>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1913</text>
  </g>
</svg>
