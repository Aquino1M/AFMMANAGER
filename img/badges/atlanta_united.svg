<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <circle cx="200" cy="200" r="190" fill="#000000" stroke="#a19261" stroke-width="10"/>
  <clipPath id="atlClip">
    <circle cx="200" cy="200" r="175"/>
  </clipPath>
  <g clip-path="url(#atlClip)">
    <rect x="0" y="0" width="400" height="400" fill="#000000"/>
    <rect x="90" y="0" width="45" height="400" fill="#80000a"/>
    <rect x="180" y="0" width="40" height="400" fill="#80000a"/>
    <rect x="265" y="0" width="45" height="400" fill="#80000a"/>
  </g>
  <!-- Central 'A' -->
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="170" fill="#a19261" stroke="#000" stroke-width="6">A</text>
  <text x="200" y="360" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="4">ATLANTA UTD</text>
</svg>