<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <filter id="fluPiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Outer Shield Border -->
  <path d="M 150 12 C 235 12, 280 25, 280 50 C 280 180, 220 280, 150 310 C 80 280, 20 180, 20 50 C 20 25, 65 12, 150 12 Z" fill="#ffffff" stroke="#791428" stroke-width="6" filter="url(#fluPiShadow)"/>
  <!-- Top Banner for PIAUÍ / FEC -->
  <clipPath id="fluPiClip">
    <path d="M 150 18 C 228 18, 272 30, 272 54 C 272 176, 214 272, 150 302 C 86 272, 28 176, 28 54 C 28 30, 72 18, 150 18 Z"/>
  </clipPath>
  <g clip-path="url(#fluPiClip)">
    <!-- Top Green band -->
    <path d="M 20 10 L 280 10 L 280 65 L 20 65 Z" fill="#006633"/>
    <text x="150" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="3">FLUMINENSE - PI</text>
    <path d="M 20 65 L 280 65 L 280 72 L 20 72 Z" fill="#ffffff"/>
    <!-- Stripes: Green, White, Garnet Red (Grena) -->
    <!-- Left Green Field -->
    <path d="M 20 72 L 105 72 L 105 310 L 20 310 Z" fill="#006633"/>
    <!-- White divider Left -->
    <path d="M 105 72 L 115 72 L 115 310 L 105 310 Z" fill="#ffffff"/>
    <!-- Center Garnet Red Field -->
    <path d="M 115 72 L 185 72 L 185 310 L 115 310 Z" fill="#791428"/>
    <!-- White divider Right -->
    <path d="M 185 72 L 195 72 L 195 310 L 185 310 Z" fill="#ffffff"/>
    <!-- Right Green Field -->
    <path d="M 195 72 L 280 72 L 280 310 L 195 310 Z" fill="#006633"/>
    <!-- Central Badge Oval with FEC Monogram & Piaui star -->
    <ellipse cx="150" cy="175" rx="60" ry="60" fill="#ffffff" stroke="#791428" stroke-width="4"/>
    <ellipse cx="150" cy="175" rx="52" ry="52" fill="#791428"/>
    <!-- FEC typography -->
    <text x="150" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2">FEC</text>
    <!-- Star for Vaqueiro / Piaui on top of oval -->
    <polygon points="150,132 153,141 162,141 155,146 158,155 150,150 142,155 145,146 138,141 147,141" fill="#facc15"/>
    <!-- Bottom banner PIAUI -->
    <path d="M 90 250 L 210 250 L 200 274 L 100 274 Z" fill="#006633" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="2">PIAUÍ</text>
  </g>
</svg>
