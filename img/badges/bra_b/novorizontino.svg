<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#f5b800" stroke-width="8"/>
  <clipPath id="novoClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#novoClip)">
    <!-- Black background -->
    <rect x="40" y="50" width="320" height="420" fill="#111111"/>
    <!-- Yellow vertical stripes on bottom half -->
    <rect x="70" y="150" width="30" height="320" fill="#f5b800"/>
    <rect x="135" y="150" width="30" height="320" fill="#f5b800"/>
    <rect x="235" y="150" width="30" height="320" fill="#f5b800"/>
    <rect x="300" y="150" width="30" height="320" fill="#f5b800"/>
    <!-- Upper Header Box in Yellow -->
    <rect x="40" y="50" width="320" height="95" fill="#f5b800"/>
    <line x1="40" y1="145" x2="360" y2="145" stroke="#111111" stroke-width="5"/>
    <text x="200" y="95" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="1">NOVORIZONTINO</text>
    <text x="200" y="130" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="3">G.E.N. • 2010</text>
    <!-- Center Tiger Badge Area -->
    <circle cx="200" cy="255" r="85" fill="#111111" stroke="#f5b800" stroke-width="6"/>
    <!-- Tiger Head Vector Silhouette / Face -->
    <path d="M150,210 C140,195 160,185 170,205 C185,195 215,195 230,205 C240,185 260,195 250,210 C270,240 260,280 200,305 C140,280 130,240 150,210 Z" fill="#f5b800"/>
    <!-- Tiger Ears inside -->
    <polygon points="160,200 168,212 154,212" fill="#111111"/>
    <polygon points="240,200 246,212 232,212" fill="#111111"/>
    <!-- Tiger Eyes -->
    <polygon points="175,230 188,236 178,242" fill="#111111"/>
    <polygon points="225,230 212,236 222,242" fill="#111111"/>
    <!-- Tiger Nose & Snout -->
    <polygon points="195,255 205,255 200,263" fill="#111111"/>
    <path d="M190,265 C195,275 205,275 210,265 L200,280 Z" fill="#111111"/>
    <!-- Whiskers & Stripes -->
    <line x1="165" y1="250" x2="140" y2="245" stroke="#111111" stroke-width="3"/>
    <line x1="165" y1="260" x2="142" y2="265" stroke="#111111" stroke-width="3"/>
    <line x1="235" y1="250" x2="260" y2="245" stroke="#111111" stroke-width="3"/>
    <line x1="235" y1="260" x2="258" y2="265" stroke="#111111" stroke-width="3"/>
    <!-- Bottom banner text -->
    <rect x="140" y="375" width="120" height="28" rx="6" fill="#f5b800"/>
    <text x="200" y="394" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="1">TIGRE DO VALE</text>
  </g>
</svg>
