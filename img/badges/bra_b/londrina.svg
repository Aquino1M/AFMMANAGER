<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Star on top (Primeira Liga 2017) -->
  <polygon points="200,10 205,25 220,25 208,35 212,50 200,40 188,50 192,35 180,25 195,25" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#0099e6" stroke-width="6"/>
  <clipPath id="lecClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#lecClip)">
    <!-- White background -->
    <rect x="40" y="65" width="320" height="410" fill="#ffffff"/>
    <!-- Sky blue vertical stripes -->
    <rect x="80" y="160" width="40" height="310" fill="#0099e6"/>
    <rect x="160" y="160" width="40" height="310" fill="#0099e6"/>
    <rect x="240" y="160" width="40" height="310" fill="#0099e6"/>
    <rect x="320" y="160" width="40" height="310" fill="#0099e6"/>
    <!-- Upper Header Box in Sky Blue -->
    <rect x="40" y="65" width="320" height="100" fill="#0099e6"/>
    <line x1="40" y1="165" x2="360" y2="165" stroke="#ffffff" stroke-width="6"/>
    <text x="200" y="135" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">L.E.C.</text>
    <!-- Center Tubarão Emblem Circle -->
    <circle cx="200" cy="275" r="75" fill="#ffffff" stroke="#0099e6" stroke-width="6"/>
    <circle cx="200" cy="275" r="66" fill="#0099e6"/>
    <text x="200" y="272" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">LONDRINA</text>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#f1c40f" text-anchor="middle">1956</text>
  </g>
</svg>
