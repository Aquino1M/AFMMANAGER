<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 5 White Stars on top -->
  <g fill="#ffffff" stroke="#111111" stroke-width="1">
    <polygon points="200,8 204,22 218,22 207,31 211,44 200,35 189,44 193,31 182,22 196,22" />
    <polygon points="160,16 163,28 175,28 165,36 169,48 160,40 151,48 155,36 145,28 157,28" />
    <polygon points="240,16 243,28 255,28 245,36 249,48 240,40 231,48 235,36 225,28 237,28" />
    <polygon points="122,28 125,39 136,39 127,46 130,56 122,50 114,56 117,46 108,39 119,39" />
    <polygon points="278,28 281,39 292,39 283,46 286,56 278,50 270,56 273,46 264,39 275,39" />
  </g>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="5"/>
  <!-- Clip for inner shield -->
  <clipPath id="cearaClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#cearaClip)">
    <!-- Black background -->
    <rect x="40" y="65" width="320" height="400" fill="#111111"/>
    <!-- White vertical stripes (alternating) -->
    <rect x="100" y="150" width="28" height="320" fill="#ffffff"/>
    <rect x="156" y="150" width="28" height="320" fill="#ffffff"/>
    <rect x="216" y="150" width="28" height="320" fill="#ffffff"/>
    <rect x="272" y="150" width="28" height="320" fill="#ffffff"/>
    <!-- Top Header Bar for "CEARÁ" -->
    <rect x="40" y="65" width="320" height="95" fill="#111111"/>
    <line x1="40" y1="160" x2="360" y2="160" stroke="#ffffff" stroke-width="6"/>
    <text x="200" y="132" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CEARÁ</text>
    <!-- Center 1914 badge -->
    <rect x="145" y="270" width="110" height="38" rx="6" fill="#111111" stroke="#ffffff" stroke-width="4"/>
    <text x="200" y="297" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">1914</text>
  </g>
</svg>
