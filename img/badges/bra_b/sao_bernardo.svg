    <text x="200" y="95" font-family="'Arial Black', Impact, sans-serif" font-size="21" font-weight="900" fill="#f5b800" text-anchor="middle" letter-spacing="1">SÃO BERNARDO F.C.</text>
    <text x="200" y="130" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">TIGRE DO ABC • 2004</text>
    <!-- Center Bernô Tiger Silhouette Area -->
