<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <clipPath id="athleticShield">
      <path d="M40,40 L360,40 L360,250 C360,370 200,455 200,455 C200,455 40,370 40,250 Z"/>
    </clipPath>
  </defs>
  <!-- Border and background -->
  <path d="M35,35 L365,35 L365,255 C365,380 200,465 200,465 C200,465 35,380 35,255 Z" fill="#bfa15f" stroke="#000000" stroke-width="4"/>
  <path d="M40,40 L360,40 L360,250 C360,370 200,455 200,455 C200,455 40,370 40,250 Z" fill="#ffffff"/>
  <!-- Clipped stripes -->
  <g clip-path="url(#athleticShield)">
    <!-- Diagonal Stripes: Black, White, Red -->
    <rect x="-100" y="-100" width="600" height="600" fill="#ffffff"/>
    <!-- Diagonal black & red stripes -->
    <polygon points="-50,550 550,-50 490,-50 -50,490" fill="#111111"/>
    <polygon points="-50,440 440,-50 380,-50 -50,380" fill="#d92027"/>
    <polygon points="-50,330 330,-50 270,-50 -50,270" fill="#111111"/>
    <polygon points="-50,220 220,-50 160,-50 -50,160" fill="#d92027"/>
    <polygon points="-50,110 110,-50 50,-50 -50,50" fill="#111111"/>
    <!-- Upper Header Box -->
    <rect x="35" y="35" width="330" height="95" fill="#111111" stroke="#bfa15f" stroke-width="3"/>
    <text x="200" y="80" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ATHLETIC CLUB</text>
    <text x="200" y="112" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#bfa15f" text-anchor="middle" letter-spacing="4">SÃO JOÃO DEL-REI</text>
    <!-- Center Emblem Circle -->
    <circle cx="200" cy="270" r="82" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <circle cx="200" cy="270" r="74" fill="#ffffff" stroke="#d92027" stroke-width="4"/>
    <!-- Monogram AC & Year -->
    <text x="200" y="278" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#111111" text-anchor="middle">AC</text>
    <rect x="155" y="300" width="90" height="24" rx="12" fill="#d92027"/>
    <text x="200" y="317" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">1909</text>
  </g>
</svg>
