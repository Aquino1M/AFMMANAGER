<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- 3 Stars on top: Gold (Brasileiro 1987), Silver (Copa do Brasil 2008), Bronze (Série B 1990) -->
  <polygon points="200,8 205,23 220,23 208,33 212,48 200,38 188,48 192,33 180,23 195,23" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <polygon points="150,16 153,28 165,28 155,36 159,48 150,40 141,48 145,36 135,28 147,28" fill="#d5d8dc" stroke="#95a5a6" stroke-width="1"/>
  <polygon points="250,16 253,28 265,28 255,36 259,48 250,40 241,48 245,36 235,28 247,28" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <!-- Outer Shield Border -->
  <path d="M40,65 L360,65 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#f1c40f" stroke-width="8"/>
  <clipPath id="sportClip">
    <path d="M46,71 L354,71 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#sportClip)">
    <!-- Alternating Horizontal Bars: Black and Red -->
    <rect x="40" y="65" width="320" height="50" fill="#111111"/>
    <rect x="40" y="115" width="320" height="50" fill="#cc1111"/>
    <rect x="40" y="165" width="320" height="50" fill="#111111"/>
    <rect x="40" y="215" width="320" height="50" fill="#cc1111"/>
    <rect x="40" y="265" width="320" height="50" fill="#111111"/>
    <rect x="40" y="315" width="320" height="50" fill="#cc1111"/>
    <rect x="40" y="365" width="320" height="110" fill="#111111"/>
    <!-- Center Golden Lion Circle / Shield -->
    <circle cx="200" cy="240" r="92" fill="#111111" stroke="#f1c40f" stroke-width="8"/>
    <circle cx="200" cy="240" r="80" fill="#111111" stroke="#cc1111" stroke-width="4"/>
    <!-- S.C.R. Monogram -->
    <text x="200" y="210" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#f1c40f" text-anchor="middle" letter-spacing="2">S.C.R.</text>
    <!-- Golden Lion Rampant Silhouette -->
    <g fill="#f1c40f">
      <!-- Lion Crown / Head -->
      <path d="M195,225 C190,220 188,228 185,232 C180,230 178,235 180,240 C175,242 178,248 182,248 C185,255 192,260 198,258 C202,262 208,260 210,255 C215,250 218,242 215,235 C212,230 205,222 195,225 Z"/>
      <!-- Lion Body & Rampant Paws -->
      <path d="M198,258 L192,285 L180,295 L185,302 L198,292 L205,305 L215,305 L208,285 L212,265 Z"/>
      <!-- Lion Forelegs raised -->
      <path d="M185,242 L170,235 L168,240 L180,248 Z"/>
      <path d="M188,252 L172,255 L170,260 L185,260 Z"/>
      <!-- Lion Tail curved -->
      <path d="M208,285 C225,280 230,260 225,250 C220,245 222,242 225,245 C232,255 230,285 208,292 Z"/>
    </g>
    <!-- Foundation year 1905 -->
    <rect x="155" y="330" width="90" height="24" rx="12" fill="#f1c40f"/>
    <text x="200" y="347" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#111111" text-anchor="middle">1905</text>
  </g>
</svg>
