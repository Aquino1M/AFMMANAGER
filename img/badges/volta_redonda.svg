<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Outer Shield Border -->
  <path d="M40,50 L360,50 L360,250 C360,375 200,465 200,465 C200,465 40,375 40,250 Z" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <clipPath id="vrClip">
    <path d="M46,56 L354,56 L354,247 C354,367 200,455 200,455 C200,455 46,367 46,247 Z"/>
  </clipPath>
  <g clip-path="url(#vrClip)">
    <!-- Yellow Background -->
    <rect x="40" y="50" width="320" height="420" fill="#f5b800"/>
    <!-- Black Vertical Half on Right -->
    <rect x="200" y="50" width="160" height="420" fill="#111111"/>
    <!-- Upper Header Box -->
    <rect x="40" y="50" width="320" height="100" fill="#ffffff"/>
    <line x1="40" y1="150" x2="360" y2="150" stroke="#111111" stroke-width="4"/>
    <text x="200" y="115" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="4">V.R.F.C.</text>
    <!-- Center Soccer Ball and Voltaço Badge -->
    <circle cx="200" cy="270" r="85" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <text x="200" y="265" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#111111" text-anchor="middle">VOLTA REDONDA</text>
    <rect x="155" y="285" width="90" height="24" rx="12" fill="#f5b800"/>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#111111" text-anchor="middle">1976</text>
  </g>
</svg>
