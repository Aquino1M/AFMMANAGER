<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="uclGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>
  </defs>
  <rect width="190" height="190" x="5" y="5" rx="30" fill="url(#uclGrad)" stroke="#38bdf8" stroke-width="4"/>
  <!-- UCL Iconic Starball -->
  <g transform="translate(100, 85) scale(0.9) translate(-100, -85)">
    <!-- Starball center -->
    <circle cx="100" cy="85" r="48" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Interlocking Stars -->
    <!-- Top -->
    <polygon points="100,40 103,50 114,50 105,56 109,66 100,60 91,66 95,56 86,50 97,50" fill="#ffffff"/>
    <!-- Top-Right -->
    <polygon points="135,55 136,65 146,68 137,73 138,84 130,77 122,82 125,72 118,65 128,66" fill="#ffffff"/>
    <!-- Bottom-Right -->
    <polygon points="132,112 130,102 139,95 128,95 125,85 119,93 109,90 115,99 110,108 120,103" fill="#ffffff"/>
    <!-- Bottom -->
    <polygon points="100,130 97,120 86,120 95,114 91,104 100,110 109,104 105,114 114,120 103,120" fill="#ffffff"/>
    <!-- Bottom-Left -->
    <polygon points="65,112 75,103 85,108 80,99 86,90 76,93 70,85 67,95 56,95 65,102" fill="#ffffff"/>
    <!-- Top-Left -->
    <polygon points="68,55 77,66 87,65 80,72 83,82 75,77 67,84 68,73 59,68 69,65" fill="#ffffff"/>
  </g>
  <text x="100" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#38bdf8" letter-spacing="3">UEFA</text>
  <text x="100" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#ffffff" letter-spacing="2">CHAMPIONS</text>
  <text x="100" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#38bdf8" letter-spacing="3">LEAGUE</text>
</svg>
