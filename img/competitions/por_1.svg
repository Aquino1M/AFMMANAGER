<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="porGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006633"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
  </defs>
  <rect width="190" height="190" x="5" y="5" rx="30" fill="url(#porGrad)" stroke="#facc15" stroke-width="4"/>
  <!-- Quinas & Armillary Sphere Accent -->
  <g transform="translate(100, 85) scale(0.9) translate(-100, -85)">
    <!-- Armillary circle -->
    <circle cx="100" cy="85" r="42" fill="none" stroke="#facc15" stroke-width="3"/>
    <ellipse cx="100" cy="85" rx="20" ry="42" fill="none" stroke="#facc15" stroke-width="2"/>
    <line x1="60" y1="85" x2="140" y2="85" stroke="#facc15" stroke-width="2"/>
    <!-- Central Shield of Portugal -->
    <path d="M 85 70 L 115 70 C 115 105 100 115 100 115 C 100 115 85 105 85 70 Z" fill="#ffffff" stroke="#003399" stroke-width="3"/>
    <circle cx="100" cy="90" r="4" fill="#003399"/>
  </g>
  <text x="100" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#facc15" letter-spacing="2">LIGA</text>
  <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="3">PORTUGAL</text>
</svg>
