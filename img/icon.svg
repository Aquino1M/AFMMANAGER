<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="50%" stop-color="#0f0c1d"/>
      <stop offset="100%" stop-color="#07050e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.8"/>

  <!-- Glowing Ball / Emblem -->
  <g filter="url(#glow)">
    <circle cx="256" cy="230" r="120" fill="none" stroke="url(#neon)" stroke-width="14"/>
    <polygon points="256,150 295,180 280,225 232,225 217,180" fill="#a855f7" opacity="0.9"/>
    <line x1="256" y1="150" x2="256" y2="110" stroke="#38bdf8" stroke-width="8"/>
    <line x1="295" y1="180" x2="335" y2="170" stroke="#38bdf8" stroke-width="8"/>
    <line x1="280" y1="225" x2="310" y2="265" stroke="#38bdf8" stroke-width="8"/>
    <line x1="232" y1="225" x2="202" y2="265" stroke="#38bdf8" stroke-width="8"/>
    <line x1="217" y1="180" x2="177" y2="170" stroke="#38bdf8" stroke-width="8"/>
  </g>

  <!-- AFM Typography -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="4">AFM 2027</text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#38bdf8" letter-spacing="6">FUTEBOL MANAGER</text>
</svg>
